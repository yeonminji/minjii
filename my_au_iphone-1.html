<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My AU iPhone</title>
<style>
:root{--wall:linear-gradient(145deg,#f8d8e8,#d9d8ff 55%,#c9e9f4);--ink:#252334}
*{box-sizing:border-box}body{margin:0;background:#f4f0f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:18px;gap:24px;flex-wrap:wrap}
.phone{width:min(370px,94vw);height:min(760px,88vh);min-height:610px;background:#111;border:7px solid #171717;border-radius:48px;padding:9px;box-shadow:0 20px 60px #4a3d5c44;position:relative;overflow:hidden}
.screen{height:100%;width:100%;border-radius:34px;overflow:hidden;position:relative;background:var(--wall)}
.status{height:38px;padding:12px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:92px;height:25px;border-radius:20px;background:#111;z-index:5}
.view{height:calc(100% - 38px);padding:18px 16px 40px;overflow:auto}
h1{font-size:34px;line-height:1.05;margin:10px 0 18px;letter-spacing:-1px}.date{font-size:14px;font-weight:650;margin-top:20px}
.widget{background:#ffffffa8;backdrop-filter:blur(16px);border:1px solid #ffffff8a;border-radius:22px;padding:14px;margin-bottom:16px}.weather{font-size:13px}.weather b{font-size:27px;display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 9px;margin-top:22px}.app{border:0;background:none;padding:0;color:inherit;text-align:center;font-size:10px;cursor:pointer}.icon{width:52px;height:52px;border-radius:15px;margin:0 auto 5px;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 8px #0001;background:#fff}.dock{position:absolute;bottom:10px;left:12px;right:12px;border-radius:25px;background:#ffffff88;backdrop-filter:blur(16px);padding:9px;display:flex;justify-content:space-around}
.dock .icon{margin:0;width:48px;height:48px}.homebar{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:100px;height:4px;background:#222;border-radius:8px;z-index:9}
.panel{background:#fffdfb;border-radius:24px;min-height:100%;margin:-18px -16px -40px;padding:18px 14px 52px}.top{display:flex;align-items:center;gap:10px;margin:0 0 15px}.back{border:0;background:#eee5f3;border-radius:15px;padding:9px 12px;font-size:14px}.top h2{font-size:20px;margin:0}.sub{font-size:12px;color:#777;margin-top:3px}
.row{display:flex;gap:10px;align-items:center;padding:12px 5px;border-bottom:1px solid #eee}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#f4dce9;font-size:20px;flex-shrink:0}.row b{display:block;font-size:14px}.row small{color:#777}.bubble{max-width:82%;padding:10px 13px;border-radius:18px;margin:9px 0;font-size:14px;background:#eeeaf3}.bubble.me{margin-left:auto;background:#9d8df5;color:white}.messages{display:flex;flex-direction:column}.inputrow{display:flex;gap:6px;position:sticky;bottom:0;background:#fff;padding:8px 0}.inputrow input,.field{min-width:0;width:100%;padding:10px;border:1px solid #ddd;border-radius:15px;font:inherit}.inputrow button,.primary{border:0;border-radius:15px;padding:10px 13px;background:#8c7bf0;color:white;font-weight:700}.post{border:1px solid #eee;border-radius:18px;padding:12px;margin-bottom:14px}.posthead{display:flex;align-items:center;gap:8px;font-weight:700}.postimg{height:170px;border-radius:12px;background:linear-gradient(135deg,#ffd4e4,#d9d5ff,#c9e9f4);display:grid;place-items:center;font-size:42px;margin:10px 0}.notesarea{width:100%;min-height:250px;border:0;outline:0;resize:vertical;font:16px/1.5 inherit;background:transparent}.settings label{display:block;font-size:13px;margin:13px 0 5px}.settings input,.settings textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:12px;font:inherit}.settings textarea{min-height:60px}.hint{font-size:12px;color:#766c7e;line-height:1.5}.toolbox{width:min(340px,94vw);background:white;border-radius:24px;padding:20px;box-shadow:0 12px 35px #4a3d5c14}.toolbox h2{margin:0 0 8px}.toolbox p{font-size:14px;line-height:1.5;color:#655d6d}.toolbox label{display:block;font-size:13px;margin:12px 0 5px}.toolbox input,.toolbox textarea,.toolbox select{width:100%;padding:10px;border:1px solid #ddd;border-radius:12px;font:inherit}.toolbox textarea{min-height:70px}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btnrow button{padding:10px 12px;border:0;border-radius:12px;background:#8c7bf0;color:white;font-weight:700}.btnrow .secondary{background:#eee8f5;color:#342b42}
@media(max-width:600px){body{padding:8px;gap:14px}.phone{height:700px;min-height:600px}.toolbox{width:min(370px,94vw)}}
</style></head>
<body>
<div class="phone"><div class="screen"><div class="status"><span id="clock">9:41</span><span>●●● ▰</span></div><div class="island"></div><main class="view" id="view"></main><div class="dock" id="dock"></div><div class="homebar" id="homebar"></div></div></div>
<aside class="toolbox"><h2>💗 My AU editor</h2><p>Change the character and phone details here. Your changes save in this browser on this device.</p>
<label>Character / phone owner</label><input id="owner" placeholder="e.g. Kim Minji">
<label>Wallpaper colour</label><select id="wall"><option value="pink">Dreamy pink</option><option value="purple">Lavender</option><option value="blue">Baby blue</option><option value="dark">Midnight</option><option value="peach">Peach</option></select>
<label>Lock-screen quote</label><input id="quote" placeholder="e.g. my favourite person ♡">
<label>Instagram username</label><input id="username" placeholder="@yourcharacter">
<label>Instagram bio</label><textarea id="bio" placeholder="write a cute bio..."></textarea>
<label>First chat name</label><input id="chatname" placeholder="e.g. My Love 💌">
<label>First chat messages (one per line; lines starting with YOU: are yours)</label><textarea id="chattext" placeholder="YOU: are you home yet?&#10;them: almost hehe ♡"></textarea>
<div class="btnrow"><button onclick="applySettings()">Save changes</button><button class="secondary" onclick="resetSettings()">Reset</button></div>
<p class="hint">Tip: tap the app icons inside the phone. This is a fictional simulator; calls and social apps don't connect to real services.</p></aside>
<script>
const defaults={owner:"Your Character",wall:"pink",quote:"my favourite person ♡",username:"@yourcharacter",bio:"♡ living in my own little world\\n📍 somewhere with you",chatname:"My Love 💌",chattext:"YOU: are you home yet?\\nthem: almost hehe ♡\\nYOU: okay, text me when you get here 💗"};
let data={...defaults,...JSON.parse(localStorage.getItem('auPhoneSettings')||'{}')};
let notes=localStorage.getItem('auPhoneNotes')||"little things to remember ♡\\n\\n- text them good morning\\n- save our favourite pictures";
let current='home',messages=[],draft='';
const apps=[['Messages','💬','#d9f8df'],['Instagram','📸','#f9dce9'],['Photos','🌸','#f6e6ff'],['Notes','📝','#fff0b8'],['Phone','📞','#d8f8df'],['Music','🎵','#f8d9e7'],['Calendar','📅','#fff'],['Settings','⚙️','#e5e5eb'],['Safari','🧭','#d9eaff'],['Camera','📷','#ddd']];
function save(){localStorage.setItem('auPhoneSettings',JSON.stringify(data))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function styleWall(){let w={pink:'linear-gradient(145deg,#f8d8e8,#d9d8ff 55%,#c9e9f4)',purple:'linear-gradient(145deg,#e5d5ff,#c6b8f5,#f4d9ee)',blue:'linear-gradient(145deg,#d9f1ff,#c5dcff,#f3e6ff)',dark:'linear-gradient(145deg,#23243f,#555078,#191a2c)',peach:'linear-gradient(145deg,#ffe0cb,#ffc9d7,#f4e6ff)'};document.documentElement.style.setProperty('--wall',w[data.wall]||w.pink);document.documentElement.style.setProperty('--ink',data.wall==='dark'?'#fff':'#252334')}
function appButton(a){return `<button class="app" onclick="openApp('${a[0]}')"><span class="icon" style="background:${a[2]}">${a[1]}</span>${a[0]}</button>`}
function renderHome(){document.getElementById('dock').style.display='flex';document.getElementById('view').innerHTML=`<div class="date">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>${esc(data.owner)}</h1><div class="widget weather"><b>☀️ 24°</b> A little sunshine for your AU<br><small>${esc(data.quote)}</small></div><div class="grid">${apps.map(appButton).join('')}</div>`;document.getElementById('dock').innerHTML=[apps[0],apps[4],apps[1],apps[5]].map(appButton).join('')}
function top(title){return `<div class="top"><button class="back" onclick="goHome()">‹ Home</button><div><h2>${title}</h2><div class="sub">${esc(data.owner)}'s phone</div></div></div>`}
function openApp(name){current=name;document.getElementById('dock').style.display='none';let v=document.getElementById('view');
if(name==='Messages'){let lines=(data.chattext||'').split('\\n').filter(Boolean);v.innerHTML=`<div class="panel">${top('Messages')}<div class="row"><div class="avatar">💗</div><div><b>${esc(data.chatname)}</b><small>iMessage · fictional chat</small></div></div><div id="msgs" class="messages">${lines.map(line=>{let me=line.toUpperCase().startsWith('YOU:');return `<div class="bubble ${me?'me':''}">${esc(line.replace(/^YOU:/i,'').replace(/^them:/i,''))}</div>`}).join('')}</div><div class="inputrow"><input id="msginput" placeholder="iMessage" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">↑</button></div></div>`}
else if(name==='Instagram'){v.innerHTML=`<div class="panel">${top('Instagram')}<h2 style="font-family:cursive">Instagram</h2><div class="row"><div class="avatar">🧸</div><div><b>${esc(data.username)}</b><small>${esc(data.bio).replace(/\\n/g,' · ')}</small></div></div><div class="post"><div class="posthead"><div class="avatar">🧸</div>${esc(data.username)}</div><div class="postimg">♡ ✨ ♡</div>♡ 1,204 likes<br><p>${esc(data.quote)} #mylove #au</p><small>fictional post · tap Settings to edit profile</small></div><div class="post"><div class="posthead">📷 Your memories</div><div class="postimg">🌷</div>somewhere, sometime, with you ♡</div></div>`}
else if(name==='Photos'){v.innerHTML=`<div class="panel">${top('Photos')}<h2>Recent Memories</h2><p class="hint">Sample fictional photo gallery</p><div class="grid">${['🌷','🌅','🧸','💌','🌙','🎀','🫧','🌸'].map((x,i)=>`<div class="postimg" style="height:85px;margin:0;font-size:32px">${x}</div>`).join('')}</div></div>`}
else if(name==='Notes'){v.innerHTML=`<div class="panel">${top('Notes')}<p class="hint">Saved automatically on this device</p><textarea class="notesarea" id="notes" oninput="notes= this.value;localStorage.setItem('auPhoneNotes',notes)">${esc(notes)}</textarea></div>`}
else if(name==='Phone'){v.innerHTML=`<div class="panel">${top('Phone')}<h2>Recents</h2><div class="row"><div class="avatar">📞</div><div><b>${esc(data.chatname)}</b><small>incoming · yesterday</small></div><span>♡</span></div><p class="hint">Fictional call history. No real calls are made.</p><div style="text-align:center;font-size:28px;margin:30px">♡</div><input class="field" placeholder="Enter fictional number"><button class="primary" style="margin-top:12px" onclick="alert('This is only a fictional AU call screen 💗')">Call</button></div>`}
else if(name==='Settings'){v.innerHTML=`<div class="panel settings">${top('Settings')}<h3>AU profile</h3><p>Use the editor beside the phone to change names, wallpaper, bio, and chats.</p><div class="row">🩷 <span>Wallpaper: ${esc(data.wall)}</span></div><div class="row">👤 <span>Owner: ${esc(data.owner)}</span></div><button class="primary" onclick="document.getElementById('owner').focus();document.querySelector('.toolbox').scrollIntoView({behavior:'smooth'})">Open AU editor</button></div>`}
else {let content={Music:['Music','🎵','Now playing: our song ♡'],Calendar:['Calendar','📅','Today · spend time together'],Safari:['Safari','🧭','Your fictional browser'],Camera:['Camera','📷','Camera preview (mockup)']}[name]||[name,'✨','A fictional app for your AU'];v.innerHTML=`<div class="panel">${top(content[0])}<div style="text-align:center;padding:45px 8px"><div style="font-size:70px">${content[1]}</div><h2>${content[2]}</h2><p class="hint">This is a demo screen. More custom features can be added.</p></div></div>`}
}
function goHome(){current='home';renderHome()}
function sendMsg(){let i=document.getElementById('msginput');if(!i||!i.value.trim())return;let m=document.getElementById('msgs');m.innerHTML+=`<div class="bubble me">${esc(i.value)}</div>`;i.value='';m.scrollTop=m.scrollHeight}
function applySettings(){for(let k of ['owner','wall','quote','username','bio','chatname','chattext']){let el=document.getElementById(k);if(el)data[k]=el.value.trim()||defaults[k]}save();styleWall();if(current==='home')renderHome();else openApp(current);alert('Saved, bestie! 💗')}
function resetSettings(){if(!confirm('Reset your AU phone to the starter details?'))return;data={...defaults};save();fillForm();styleWall();goHome()}
function fillForm(){for(let k of Object.keys(defaults)){let el=document.getElementById(k);if(el)el.value=data[k]}}
document.getElementById('homebar').onclick=goHome;
function tick(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
fillForm();styleWall();renderHome();tick();setInterval(tick,15000);
</script></body></html>
